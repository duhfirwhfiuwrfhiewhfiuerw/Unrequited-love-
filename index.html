<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지수 일기</title>
    <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff3f6; font-family: 'DungGeunMo', monospace; display: flex; flex-direction: column; align-items: center; padding: 10px 0; touch-action: manipulation; overflow-x: hidden; }
        canvas { width: 95%; max-width: 500px; background: #fdf6f0; border: 3px solid #e8cfcf; image-rendering: pixelated; border-radius: 10px; cursor: pointer; display: block; }
        #textBox {
            width: 95%; max-width: 500px; height: 130px; margin-top: 15px; padding: 15px;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            border: 4px solid #e8cfcf; box-shadow: inset 0 0 0 2px #ffffff, 5px 5px 0px rgba(232, 207, 207, 0.5);
            border-radius: 15px; box-sizing: border-box; line-height: 1.6; color: #5a4f4f; font-size: 15px; 
            overflow-y: auto; word-break: keep-all; position: relative;
        }
        .msg-entry { margin-bottom: 10px; border-bottom: 1px dashed #ffe0e5; padding-bottom: 6px; }
        .music-player { margin-top: 10px; width: 95%; max-width: 500px; text-align: center; }
        .music-label { font-size: 12px; color: #e8cfcf; margin-bottom: 5px; }
        #yt-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="textBox"></div>

<div class="music-player">
    <div class="music-label">Now Playing: 동물의 숲 브금 🍃</div>
    <iframe id="yt-player"
        src="https://www.youtube.com/embed/GYediWu_ixw?autoplay=1&loop=1&playlist=GYediWu_ixw&enablejsapi=1" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500; canvas.height = 500;

let currentMap = "room";

const messages = {
    welcome: "지수의 방에 온걸 환영해! 가구를 클릭하면 지수가 이동하며 말을 할 거야 💗",
    tv: "어렸을때 티비를 자주봤어. 만화 위주로 봤었던 것같은데 요즘은 잘 안봐",
    bed: "중요한 날이니까 일찍 일어나야해!",
    table: "오빠한테 카톡보내놔야겠다",
    bath: "얼른 준비해야지!",
    closet: "무슨 옷을 입어야 잘 보일까?",
    kitchen: "도시락 성공하고 싶어!",
    bench: "여기가 사진에 표시된 그 벤치야! 여기서 기다리자.",
    train_body: "빨간 원 영역에 있는 열차야! 정말 크지?"
};

const mapData = {
    room: {
        bg: "https://i.imgur.com/bMfMr3n.png",
        objects: [
            { name: 'closet', x: 30, y: 100, w: 80, h: 100, img: "https://i.imgur.com/GMdqkYn.png" }, 
            { name: 'bed', x: 190, y: 100, w: 120, h: 90, img: "https://i.imgur.com/gxjbbIY.png" },
            { name: 'tv', x: 380, y: 100, w: 90, h: 80, img: "https://i.imgur.com/x95Hwnw.png" },
            { name: 'kitchen', x: 30, y: 340, w: 120, h: 90, img: "https://i.imgur.com/86AUFui.png" },
            { name: 'table', x: 200, y: 350, w: 100, h: 80, img: "https://i.imgur.com/EnAb1YP.png" },
            { name: 'bath', x: 380, y: 340, w: 90, h: 90, img: "https://i.imgur.com/viVc6C0.png" }
        ],
        door: { x: 460, y: 200, w: 40, h: 100, target: "station" },
        bounds: { minX: 40, maxX: 460, minY: 150, maxY: 450 }
    },
    station: {
        bg: "https://i.imgur.com/GvvmB4e.jpeg",
        objects: [
            // 1. 벤치: 사진 하단 검은색 동그라미 위치 (중앙 하단)
            { name: 'bench', x: 180, y: 420, w: 140, h: 60, img: "https://i.imgur.com/LM0zkps.png" }, 
            // 2. 열차: 사진 중앙~우하단 빨간색 동그라미 위치 (크게 배치)
            { name: 'train_body', x: 220, y: 230, w: 260, h: 180, img: "https://i.imgur.com/P0iVk3l.png" } 
        ],
        // 열차 내부로 들어가는 판정 (빨간 원 내부)
        door: { x: 250, y: 250, w: 200, h: 150, target: "srt_inside" },
        bounds: { minX: 10, maxX: 490, minY: 100, maxY: 490 }
    },
    srt_inside: {
        bg: "https://i.imgur.com/3N4o89c.png", 
        objects: [],
        door: { x: 0, y: 400, w: 500, h: 100, target: "station" },
        bounds: { minX: 50, maxX: 450, minY: 150, maxY: 450 }
    }
};

const playerImages = { front: new Image(), back: new Image(), left: new Image(), right: new Image() };
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";
playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";
playerImages.left.src = "https://i.imgur.com/ginoxYa.png";
playerImages.right.src = "https://i.imgur.com/cQLW6ag.png";

const backgroundImg = new Image();
let player = { x: 250, y: 300, size: 55, step: 40, direction: "front", name: "지수" };

Object.values(mapData).forEach(map => {
    map.objects.forEach(obj => {
        if(obj.img) {
            obj.imgObj = new Image();
            obj.imgObj.src = obj.img;
        }
    });
});

function addText(text) {
    if(!text) return;
    const box = document.getElementById('textBox');
    const newMsg = document.createElement('div');
    newMsg.className = 'msg-entry';
    newMsg.innerHTML = text;
    box.appendChild(newMsg);
    box.scrollTop = box.scrollHeight;
}

function loadMap(mapName) {
    currentMap = mapName;
    backgroundImg.src = mapData[mapName].bg;
    if(mapName === "station") {
        player.x = 100; player.y = 280; // 사진 왼쪽 빈 공간(승강장)에서 시작
        addText("송정역에 도착했어! 표시한 위치로 옮겼어. ✨");
    } else if(mapName === "room") {
        player.x = 400; player.y = 300;
    }
}

function handleInteraction(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const clickX = (clientX - rect.left) * scaleX;
    const clickY = (clientY - rect.top) * scaleY;

    const door = mapData[currentMap].door;
    if (clickX > door.x && clickX < door.x + door.w && clickY > door.y && clickY < door.y + door.h) {
        loadMap(door.target);
        return;
    }

    let targetObj = null;
    mapData[currentMap].objects.forEach(obj => {
        if (clickX > obj.x && clickX < obj.x + obj.w && clickY > obj.y && clickY < obj.y + obj.h) {
            targetObj = obj;
        }
    });

    const diffX = clickX - player.x;
    const diffY = clickY - player.y;
    if (Math.abs(diffX) > Math.abs(diffY)) {
        player.x += diffX > 0 ? player.step : -player.step;
        player.direction = diffX > 0 ? "right" : "left";
    } else {
        player.y += diffY > 0 ? player.step : -player.step;
        player.direction = diffY > 0 ? "front" : "back";
    }

    const bounds = mapData[currentMap].bounds;
    player.x = Math.max(bounds.minX, Math.min(bounds.maxX, player.x));
    player.y = Math.max(bounds.minY, Math.min(bounds.maxY, player.y));

    if (targetObj) addText(messages[targetObj.name]);
}

canvas.addEventListener('mousedown', handleInteraction);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, {passive: false});

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (backgroundImg.complete) ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    mapData[currentMap].objects.forEach(obj => {
        if (obj.imgObj && obj.imgObj.complete) ctx.drawImage(obj.imgObj, obj.x, obj.y, obj.w, obj.h);
    });
    const pImg = playerImages[player.direction];
    if (pImg.complete) ctx.drawImage(pImg, player.x - 27, player.y - 27, 55, 55);
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.fillRect(player.x - 25, player.y - 45, 50, 18);
    ctx.fillStyle = "white";
    ctx.font = "14px 'DungGeunMo'";
    ctx.textAlign = "center";
    ctx.fillText(player.name, player.x, player.y - 31);
    requestAnimationFrame(draw);
}

backgroundImg.onload = draw;
window.onload = () => { backgroundImg.src = mapData["room"].bg; addText(messages.welcome); };
</script>
</body>
</html>
