<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우리 집 이야기</title>

<link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">

<style>

body{

  margin:0;

  background:#fff3f6;

  font-family:'DungGeunMo', monospace;

  display:flex;

  flex-direction:column;

  align-items:center;

}

canvas{

  width:100%;

  max-width:500px;

  background:#fdf6f0;

  image-rendering: pixelated;

  border:3px solid #e8cfcf;

}

#textBox{

  width:100%;

  max-width:500px;

  min-height:120px;

  background:white;

  padding:15px;

  border-top:3px solid #e8cfcf;

  box-sizing:border-box;

  line-height:1.6;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="textBox">화면을 터치해서 움직여봐 💗</div>

<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500;
canvas.height = 300;

// 이미지 로딩 확인용 카운터
let imagesLoaded = 0;
const totalImages = 5; // 배경1 + 캐릭터1(현재는 front만 사용 중이므로) + 가구... (필요에 따라 조정)

function imageLoaded() {
    imagesLoaded++;
}

const backgroundImg = new Image();
backgroundImg.src = "https://i.imgur.com/bMfMr3n.png";
backgroundImg.onload = imageLoaded;
/* =========================

   💖 캐릭터 이미지 넣는 곳

   ========================= */

const playerImages = {
  front: new Image(),
  back: new Image(),
  left: new Image(),
  right: new Image()
};
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";

playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";

playerImages.left.src = "https://i.imgur.com/ginoxYa.png";

playerImages.right.src = "https://i.imgur.com/Kn58OH2.png";

/* =========================

   캐릭터 설정

   ========================= */

let player = {
  x: 250,
  y: 150,
  size: 60, // 캐릭터 크기 조절
  targetX: 250,
  targetY: 150,
  direction: "front",
  speed: 0.05 // 이동 속도 조절 (0.1은 너무 빠를 수 있음)
};

/* =========================

   💖 가구 이미지 넣는 곳

   ========================= */

const objects = [

  {

    name:'tv',

    x:50, y:50, w:50, h:40,

    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/x95Hwnw.png"; return i; })()

  },

  {

    name:'bed',

    x:380, y:60, w:60, h:40,

    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/gxjbbIY.png"; return i; })()

  },

  {

    name:'table',

    x:200, y:200, w:60, h:40,

    img: (()=>{ let i=new Image(); i.src="테이블 이미지 링크"; return i; })()

  },

  {

    name:'bath',

    x:400, y:200, w:50, h:40,

    img: (()=>{ let i=new Image(); i.src="욕실 이미지 링크"; return i; })()

  }

];

/* =========================

   텍스트

   ========================= */

const messages = {

  tv: "우리 여기서 같이 공포영화 보다가 무서워서 불 다 켜고 잤었지?",

  bed: "이 침대에서 진짜 많이 웃고 얘기했던 거 생각나",

  table: "같이 밥 먹으면서 별 얘기 다 했던 거 좋았어",

  bath: "별거 아닌 순간인데도 같이 있어서 좋았던 기억이야"

};

/* ========================= */

function typeText(text){

  let i = 0;

  const box = document.getElementById('textBox');

  box.innerHTML = "";

  const interval = setInterval(()=>{

    box.innerHTML += text[i];

    i++;

    if(i >= text.length) clearInterval(interval);

  }, 30);

}

/* ========================= */

canvas.addEventListener('click', (e)=>{

  const rect = canvas.getBoundingClientRect();

  player.targetX = e.clientX - rect.left;

  player.targetY = e.clientY - rect.top;

});

/* ========================= */

function update(){
  let dx = player.targetX - player.x;
  let dy = player.targetY - player.y;

  // 목적지에 거의 도착하면 멈춤 (덜덜 떨리는 현상 방지)
  if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

  if(Math.abs(dx) > Math.abs(dy)){
    player.direction = dx > 0 ? "right" : "left";
  } else {
    player.direction = dy > 0 ? "front" : "back";
  }

  player.x += dx * player.speed;
  player.y += dy * player.speed;
  
  checkCollision();
}

/* ========================= */

let lastObject = null;

function checkCollision(){

  objects.forEach(obj=>{

    const dx = player.x - obj.x;

    const dy = player.y - obj.y;

    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < 40){

      if(lastObject !== obj.name){

        typeText(messages[obj.name]);

        lastObject = obj.name;

      }

    }

  });

}

/* ========================= */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // 배경 그리기
  ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);

  // 가구 그리기
  objects.forEach(obj=>{
    if(obj.img.complete) { // 이미지가 로드된 경우에만 그림
        ctx.drawImage(obj.img, obj.x, obj.y, obj.w, obj.h);
    }
  });

  // 캐릭터 그리기
  const img = playerImages[player.direction];
  if(img.complete) {
      // 캐릭터를 중앙 점 기준으로 그림
      ctx.drawImage(img, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
  }
}

/* ========================= */

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>

</html>
