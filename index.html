<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지수 일기</title>
    <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff3f6; font-family: 'DungGeunMo', monospace; display: flex; flex-direction: column; align-items: center; padding: 10px 0; touch-action: manipulation; overflow-x: hidden; }
        canvas { width: 95%; max-width: 500px; background: #fdf6f0; border: 3px solid #e8cfcf; image-rendering: pixelated; border-radius: 10px; cursor: pointer; display: block; }
        #textBox {
            width: 95%; max-width: 500px; min-height: 110px; margin-top: 15px; padding: 18px;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            border: 4px solid #e8cfcf; box-shadow: inset 0 0 0 2px #ffffff, 5px 5px 0px rgba(232, 207, 207, 0.5);
            border-radius: 15px; box-sizing: border-box; line-height: 1.6; color: #5a4f4f; font-size: 15px; position: relative; word-break: keep-all;
        }
        #textBox::after { content: ' ▼'; position: absolute; bottom: 10px; right: 15px; color: #ffb6c1; font-size: 12px; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: 0.3; transform: translateY(2px); } }
        .music-player { margin-top: 10px; width: 95%; max-width: 500px; text-align: center; }
        .music-label { font-size: 12px; color: #e8cfcf; margin-bottom: 5px; }
        #yt-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="textBox">지수의 방에 온걸 환영해! 가구를 클릭하면 지수가 이동하며 말을 할 거야 💗</div>

<div class="music-player">
    <div class="music-label">Now Playing: 동물의 숲 브금 🍃</div>
    <iframe id="yt-player"
        src="https://www.youtube.com/embed/GYediWu_ixw?autoplay=1&loop=1&playlist=GYediWu_ixw&enablejsapi=1" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500; canvas.height = 500;

let currentMap = "room";
const mapData = {
    room: {
        bg: "https://i.imgur.com/bMfMr3n.png",
        objects: [
            { name: 'closet', x: 30, y: 100, w: 80, h: 100, img: "https://i.imgur.com/GMdqkYn.png" }, 
            { name: 'bed', x: 190, y: 100, w: 120, h: 90, img: "https://i.imgur.com/gxjbbIY.png" },
            { name: 'tv', x: 380, y: 100, w: 90, h: 80, img: "https://i.imgur.com/x95Hwnw.png" },
            { name: 'kitchen', x: 30, y: 340, w: 120, h: 90, img: "https://i.imgur.com/86AUFui.png" },
            { name: 'table', x: 200, y: 350, w: 100, h: 80, img: "https://i.imgur.com/EnAb1YP.png" },
            { name: 'bath', x: 380, y: 340, w: 90, h: 90, img: "https://i.imgur.com/viVc6C0.png" }
        ],
        door: { x: 460, y: 200, w: 40, h: 100, target: "station" },
        bounds: { minX: 40, maxX: 460, minY: 150, maxY: 450 }
    },
    station: {
        bg: "https://i.imgur.com/vHInE3r.png",
        objects: [
            { name: 'bench', x: 250, y: 380, w: 120, h: 100, img: "" }, // 벤치 영역 조정
            { name: 'train_body', x: 0, y: 0, w: 500, h: 280, img: "" } // 열차 윗부분 클릭 영역
        ],
        // 열차 투명한 문 부분 (클릭 시 이동)
        door: { x: 210, y: 150, w: 80, h: 150, target: "srt_inside" },
        bounds: { minX: 30, maxX: 470, minY: 320, maxY: 460 } // 이동 제한
    },
    srt_inside: {
        bg: "https://i.imgur.com/3N4o89c.png", // 열차 내부 이미지 (필요시 교체)
        objects: [],
        door: { x: 0, y: 400, w: 500, h: 100, target: "station" },
        bounds: { minX: 50, maxX: 450, minY: 150, maxY: 450 }
    }
};

const backgroundImg = new Image();
const playerImages = { front: new Image(), back: new Image(), left: new Image(), right: new Image() };
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";
playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";
playerImages.left.src = "https://i.imgur.com/ginoxYa.png";
playerImages.right.src = "https://i.imgur.com/cQLW6ag.png";

let player = { x: 250, y: 300, size: 55, step: 40, direction: "front", name: "지수" };

const messages = {
    tv: "어렸을때 티비를 자주봤어. 만화 위주로 봤었던 것같은데 요즘은 잘 안봐",
    bed: "중요한 날이니까 일찍 일어나야해! 알람맞춰놓고 열차시간 맞춰서 일어났어",
    table: "화장 다 하고 버스기다릴때 앉아있어야지 오빠한테 카톡보내놔야겠다",
    bath: "여긴 내가 화장하는 곳이야 따로 화장대가 없어서 여기서 자주 치장해. 얼른 준비해야지!",
    closet: "이건 옷장이야. 중요한 날에는 무슨옷을 입어야 잘보일지 고민을 많이해서 지각한적이 있어",
    kitchen: "오빠한테 도시락을 만들어줘야해 하지만 한번에 성공한적이 없어",
    bench: " 조금 일찍 도착했으니까 여기서 열차를 기다릴수 있어 ",
    train_body: " 내가 타야하는 열차야! 일찍 도착했으니까 빨리타서 안에서 기다리자. 열차에 투명부분을 눌러봐! "
};

function loadMap(mapName) {
    currentMap = mapName;
    backgroundImg.src = mapData[mapName].bg;
    
    if(mapName === "station") {
        player.x = 100; player.y = 400;
        typeText("송정역에 도착했어! 오브젝트들을 클릭해봐");
    } else if(mapName === "room") {
        player.x = 400; player.y = 300;
    }
}
loadMap("room");

function typeText(text) {
    let i = 0; const box = document.getElementById('textBox'); box.innerHTML = "";
    clearInterval(window.textInterval);
    window.textInterval = setInterval(() => {
        box.innerHTML += text[i++];
        if (i >= text.length) clearInterval(window.textInterval);
    }, 30);
}

canvas.addEventListener('mousedown', (e) => handleInteraction(e));
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e.touches[0]); }, {passive: false});

function handleInteraction(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clickX = (e.clientX - rect.left) * scaleX;
    const clickY = (e.clientY - rect.top) * scaleY;

    // 1. 문(다음 페이지) 체크
    const door = mapData[currentMap].door;
    if (clickX > door.x && clickX < door.x + door.w && clickY > door.y && clickY < door.y + door.h) {
        loadMap(door.target);
        return;
    }

    // 2. 오브젝트(멘트) 체크
    let targetObj = null;
    mapData[currentMap].objects.forEach(obj => {
        if (clickX > obj.x && clickX < obj.x + obj.w && clickY > obj.y && clickY < obj.y + obj.h) {
            targetObj = obj;
        }
    });

    // 3. 이동 처리 및 충돌 방지
    let nextX = player.x;
    let nextY = player.y;
    const diffX = clickX - player.x;
    const diffY = clickY - player.y;

    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 0) { nextX += player.step; player.direction = "right"; }
        else { nextX -= player.step; player.direction = "left"; }
    } else {
        if (diffY > 0) { nextY += player.step; player.direction = "front"; }
        else { nextY -= player.step; player.direction = "back"; }
    }

    // 맵 경계 제한
    const bounds = mapData[currentMap].bounds;
    if (nextX < bounds.minX) nextX = bounds.minX;
    if (nextX > bounds.maxX) nextX = bounds.maxX;
    if (nextY < bounds.minY) nextY = bounds.minY;
    if (nextY > bounds.maxY) nextY = bounds.maxY;

    // 가구 충돌 체크 (뚫기 방지)
    let canMove = true;
    if (currentMap === "room") {
        mapData.room.objects.forEach(obj => {
            if (nextX > obj.x - 20 && nextX < obj.x + obj.w + 20 && nextY > obj.y - 20 && nextY < obj.y + obj.h + 20) {
                canMove = false;
            }
        });
    }

    if (canMove) {
        player.x = nextX;
        player.y = nextY;
    }

    // 멘트 출력
    if (targetObj) {
        typeText(messages[targetObj.name]);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (backgroundImg.complete) ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    
    // 룸 맵에서만 가구 이미지 그리기
    if (currentMap === "room") {
        mapData.room.objects.forEach(obj => {
            if (obj.imgObj) ctx.drawImage(obj.imgObj, obj.x, obj.y, obj.w, obj.h);
        });
    }

    const img = playerImages[player.direction];
    if (img.complete) {
        ctx.drawImage(img, player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
    }
    
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; ctx.fillRect(player.x - 25, player.y - 45, 50, 20);
    ctx.fillStyle = "white"; ctx.font = "14px 'DungGeunMo'"; ctx.textAlign = "center"; ctx.fillText(player.name, player.x, player.y - 30);
    requestAnimationFrame(draw);
}
// 가구 이미지 미리 로드
Object.values(mapData).forEach(map => {
    map.objects.forEach(obj => { if(obj.img) { obj.imgObj = new Image(); obj.imgObj.src = obj.img; } });
});
draw();
</script>
</body>
</html>
