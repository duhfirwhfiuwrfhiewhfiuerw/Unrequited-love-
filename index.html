<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>지수 일기</title>

<link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">

<style>

body{

  margin:0;

  background:#fff3f6;

  font-family:'DungGeunMo', monospace;

  display:flex;

  flex-direction:column;

  align-items:center;

}

canvas{

  width:100%;

  max-width:500px;

  background:#fdf6f0;

  image-rendering: pixelated;

  border:3px solid #e8cfcf;

}

#textBox{

  width:100%;

  max-width:500px;

  min-height:120px;

  background:white;

  padding:15px;

  border-top:3px solid #e8cfcf;

  box-sizing:border-box;

  line-height:1.6;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="textBox">화면을 터치해서 움직여봐 💗</div>

<script>

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500;
canvas.height = 300;

// 이미지 로딩 확인용 카운터
let imagesLoaded = 0;
const totalImages = 5; // 배경1 + 캐릭터1(현재는 front만 사용 중이므로) + 가구... (필요에 따라 조정)

function imageLoaded() {
    imagesLoaded++;
}

const backgroundImg = new Image();
backgroundImg.src = "https://i.imgur.com/bMfMr3n.png";
backgroundImg.onload = imageLoaded;
/* =========================

   💖 캐릭터 이미지 넣는 곳

   ========================= */

const playerImages = {
  front: new Image(),
  back: new Image(),
  left: new Image(),
  right: new Image()
};
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";

playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";

playerImages.left.src = "https://i.imgur.com/ginoxYa.png";

playerImages.right.src = "https://i.imgur.com/Kn58OH2.png";

/* =========================

   캐릭터 설정

   ========================= */

let player = {
  x: 250,
  y: 150,
  size: 60, // 캐릭터 크기 조절
  targetX: 250,
  targetY: 150,
  direction: "front",
  speed: 0.05 // 이동 속도 조절 (0.1은 너무 빠를 수 있음)
};

/* =========================

   💖 가구 이미지 넣는 곳

   ========================= */

const objects = [
  {
    name:'tv',
    x:30, y:30, w:80, h:70, // 크기를 50->80으로 키움
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/x95Hwnw.png"; return i; })()
  },
  {
    name:'bed',
    x:360, y:40, w:100, h:80, // 크기를 60->100으로 키움
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/gxjbbIY.png"; return i; })()
  },
  {
    name:'table',
    x:180, y:180, w:90, h:70, 
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/EnAb1YP.png"; return i; })()
  },
  {
    name:'bath',
    x:380, y:200, w:80, h:70,
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/viVc6C0.png"; return i; })()
  },
  {
    name:'closet',
    x:20, y:180, w:70, h:90, // 옷장 추가
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/GMdqkYn.png"; return i; })() 
  },
  {
    name:'kitchen',
    x:200, y:30, w:110, h:80, // 부엌 추가
    img: (()=>{ let i=new Image(); i.src="https://i.imgur.com/86AUFui.png"; return i; })()
  }
];

/* =========================
   텍스트 (새 가구 메시지 추가)
   ========================= */
const messages = {
  tv: "어렸을때 티비를 자주봤어. 만화 위주로 봤었던 것같은데 요즘은 잘 안봐",
  bed: "중요한 날이니까 일찍 일어나야해! 알람맞춰놓고 열차시간 맞춰서 일어났어",
  table: "화장 다 하고 버스기다릴때 앉아있어야지 오빠한테 카톡보내놔야겠다 ",
  bath: "여긴 내가 화장하는 곳이야 따로 화장대가 없어서 여기서 자주 치장해. 얼른 준비해야지!",
  closet: "이건 옷장이야. 중요한 날에는 무슨옷을 입어야 잘보일지 고민을 많이해서 지각한적이 있어",
  kitchen: "오빠한테 도시락을 만들어줘야해 하지만 한번에 성공한적이 없어"
};

/* ========================= */

function typeText(text){

  let i = 0;

  const box = document.getElementById('textBox');

  box.innerHTML = "";

  const interval = setInterval(()=>{

    box.innerHTML += text[i];

    i++;

    if(i >= text.length) clearInterval(interval);

  }, 30);

}

/* ========================= */

canvas.addEventListener('click', (e)=>{

  const rect = canvas.getBoundingClientRect();

  player.targetX = e.clientX - rect.left;

  player.targetY = e.clientY - rect.top;

});

/* ========================= */

function update(){
  let dx = player.targetX - player.x;
  let dy = player.targetY - player.y;

  // 목적지에 거의 도착하면 멈춤 (덜덜 떨리는 현상 방지)
  if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

  if(Math.abs(dx) > Math.abs(dy)){
    player.direction = dx > 0 ? "right" : "left";
  } else {
    player.direction = dy > 0 ? "front" : "back";
  }

  player.x += dx * player.speed;
  player.y += dy * player.speed;
  
  checkCollision();
}

/* ========================= */

let lastObject = null;

function checkCollision(){

  objects.forEach(obj=>{

    const dx = player.x - obj.x;

    const dy = player.y - obj.y;

    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist < 40){

      if(lastObject !== obj.name){

        typeText(messages[obj.name]);

        lastObject = obj.name;

      }

    }

  });

}

/* ========================= */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  
  // 배경 그리기
  ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);

  // 가구 그리기
  objects.forEach(obj=>{
    if(obj.img.complete) { // 이미지가 로드된 경우에만 그림
        ctx.drawImage(obj.img, obj.x, obj.y, obj.w, obj.h);
    }
  });

  // 캐릭터 그리기
  const img = playerImages[player.direction];
  if(img.complete) {
      // 캐릭터를 중앙 점 기준으로 그림
      ctx.drawImage(img, player.x - player.size/2, player.y - player.size/2, player.size, player.size);
  }
}

/* ========================= */

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>

</body>

</html>
