<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지수 일기</title>
    <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2107@1.1/DungGeunMo.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff3f6; font-family: 'DungGeunMo', monospace; display: flex; flex-direction: column; align-items: center; padding: 10px 0; touch-action: manipulation; overflow-x: hidden; }
        canvas { width: 95%; max-width: 500px; background: #fdf6f0; border: 3px solid #e8cfcf; image-rendering: pixelated; border-radius: 10px; cursor: pointer; display: block; }
        #textBox {
            width: 95%; max-width: 500px; min-height: 130px; margin-top: 15px; padding: 22px;
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%);
            border: 4px solid #e8cfcf; box-shadow: inset 0 0 0 2px #ffffff, 5px 5px 0px rgba(232, 207, 207, 0.5);
            border-radius: 15px; box-sizing: border-box; line-height: 1.8; color: #5a4f4f; font-size: 16px; position: relative; word-break: keep-all;
        }
        #textBox::after { content: ' ▼'; position: absolute; bottom: 15px; right: 20px; color: #ffb6c1; font-size: 14px; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: 0.3; transform: translateY(2px); } }
        .music-player { margin-top: 10px; width: 95%; max-width: 500px; text-align: center; }
        .music-label { font-size: 12px; color: #e8cfcf; margin-bottom: 5px; }
        #yt-player { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="game"></canvas>
<div id="textBox">지수의 방에 온걸 환영해! 캐릭터를 가구 근처로 옮겨서 쳐다봐봐 💗</div>

<div class="music-player">
    <div class="music-label">Now Playing: 동물의 숲 브금 🍃</div>
    <iframe id="yt-player"
        src="https://www.youtube.com/embed/GYediWu_ixw?autoplay=1&loop=1&playlist=GYediWu_ixw&enablejsapi=1" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 500; canvas.height = 500;

let currentMap = "room";
const mapData = {
    room: {
        bg: "https://i.imgur.com/bMfMr3n.png",
        objects: [
            { name: 'closet', label: '옷장', x: 30, y: 80, w: 90, h: 120, img: "https://i.imgur.com/GMdqkYn.png" }, 
            { name: 'bed', label: '침대', x: 190, y: 80, w: 120, h: 100, img: "https://i.imgur.com/gxjbbIY.png" },
            { name: 'tv', label: 'TV', x: 380, y: 80, w: 90, h: 90, img: "https://i.imgur.com/x95Hwnw.png" },
            { name: 'kitchen', label: '부엌', x: 30, y: 320, w: 120, h: 110, img: "https://i.imgur.com/86AUFui.png" },
            { name: 'table', label: '테이블', x: 200, y: 330, w: 100, h: 90, img: "https://i.imgur.com/EnAb1YP.png" },
            { name: 'bath', label: '욕실', x: 380, y: 320, w: 90, h: 110, img: "https://i.imgur.com/viVc6C0.png" }
        ],
        door: { x: 450, y: 200, w: 50, h: 100 }
    },
    garden: {
        bg: "https://i.imgur.com/vHInE3r.png",
        objects: [
            { name: 'tree', label: '나무', x: 80, y: 110, w: 130, h: 170, img: "https://i.imgur.com/hV8fGIm.png" },
            { name: 'mailbox', label: '우체통', x: 400, y: 340, w: 60, h: 80, img: "https://i.imgur.com/5yPq2uO.png" }
        ],
        door: { x: 0, y: 200, w: 50, h: 100 }
    }
};

const playerImages = { front: new Image(), back: new Image(), left: new Image(), right: new Image() };
playerImages.front.src = "https://i.imgur.com/l1ENJqo.png";
playerImages.back.src = "https://i.imgur.com/nbzUAfX.png";
playerImages.left.src = "https://i.imgur.com/ginoxYa.png";
playerImages.right.src = "https://i.imgur.com/Kn58OH2.png";

const backgroundImg = new Image();
let player = { x: 250, y: 300, size: 55, step: 100, direction: "front", name: "지수" };

const messages = {
    tv: "어렸을때 티비를 자주봤어. 만화 위주로 봤었던 것같은데 요즘은 잘 안봐",
    bed: "중요한 날이니까 일찍 일어나야해! 알람맞춰놓고 열차시간 맞춰서 일어났어",
    table: "화장 다 하고 버스기다릴때 앉아있어야지 오빠한테 카톡보내놔야겠다",
    bath: "여긴 내가 화장하는 곳이야 따로 화장대가 없어서 여기서 자주 치장해. 얼른 준비해야지!",
    closet: "이건 옷장이야. 중요한 날에는 무슨옷을 입어야 잘보일지 고민을 많이해서 지각한적이 있어",
    kitchen: "오빠한테 도시락을 만들어줘야해 하지만 한번에 성공한적이 없어",
    tree: "정말 커다란 나무야. 그늘이 시원해.",
    mailbox: "편지가 왔나 확인해볼까?"
};

function loadMap(mapName) {
    currentMap = mapName;
    backgroundImg.src = mapData[mapName].bg;
    mapData[mapName].objects.forEach(obj => { obj.imgObj = new Image(); obj.imgObj.src = obj.img; });
    player.x = (mapName === "garden") ? 80 : 420;
}
loadMap("room");

function typeText(text) {
    let i = 0; const box = document.getElementById('textBox'); box.innerHTML = "";
    clearInterval(window.textInterval);
    window.textInterval = setInterval(() => {
        box.innerHTML += text[i++];
        if (i >= text.length) clearInterval(window.textInterval);
    }, 30);
}

canvas.addEventListener('mousedown', (e) => handleInteraction(e));
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e.touches[0]); }, {passive: false});

function handleInteraction(e) {
    const rect = canvas.getBoundingClientRect();
    const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
    const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

    // 🚪 문 터치 (이동)
    const door = mapData[currentMap].door;
    if (clickX > door.x && clickX < door.x + door.w && clickY > door.y && clickY < door.y + door.h) {
        loadMap(currentMap === "room" ? "garden" : "room");
        return;
    }

    // 🏠 가구 클릭 (방향만 바꾸고 체크)
    for (let obj of mapData[currentMap].objects) {
        if (clickX > obj.x && clickX < obj.x + obj.w && clickY > obj.y && clickY < obj.y + obj.h) {
            lookAt(obj);
            checkProximity();
            return;
        }
    }

    // 🚶 바닥 클릭 (2칸씩 이동)
    movePlayer(clickX, clickY);
    checkProximity();
}

function lookAt(obj) {
    const dx = (obj.x + obj.w / 2) - player.x;
    const dy = (obj.y + obj.h / 2) - player.y;
    if (Math.abs(dx) > Math.abs(dy)) { player.direction = dx > 0 ? "right" : "left"; }
    else { player.direction = dy > 0 ? "front" : "back"; }
}

function movePlayer(tx, ty) {
    let nx = player.x; let ny = player.y;
    const dx = tx - player.x; const dy = ty - player.y;

    if (Math.abs(dx) > Math.abs(dy)) {
        nx += dx > 0 ? player.step : -player.step;
        player.direction = dx > 0 ? "right" : "left";
    } else {
        ny += dy > 0 ? player.step : -player.step;
        player.direction = dy > 0 ? "front" : "back";
    }

    // 경계 및 가구 충돌 체크
    if (nx < 40 || nx > 460 || ny < 150 || ny > 450) return;
    for (let obj of mapData[currentMap].objects) {
        if (nx > obj.x - 10 && nx < obj.x + obj.w + 10 && ny > obj.y - 10 && ny < obj.y + obj.h + 10) return;
    }
    player.x = nx; player.y = ny;
}

function checkProximity() {
    mapData[currentMap].objects.forEach(obj => {
        const dx = player.x - (obj.x + obj.w / 2);
        const dy = player.y - (obj.y + obj.h / 2);
        const range = 80; // 가구 근처 판정 범위

        let isCorrectSide = false;
        // 캐릭터가 가구의 특정 방향 옆에 있고, 그 가구를 바라보고 있는지 체크
        if (player.direction === "right" && dx < 0 && Math.abs(dx) < range + obj.w/2 && Math.abs(dy) < obj.h/2 + 20) isCorrectSide = true;
        if (player.direction === "left" && dx > 0 && Math.abs(dx) < range + obj.w/2 && Math.abs(dy) < obj.h/2 + 20) isCorrectSide = true;
        if (player.direction === "front" && dy < 0 && Math.abs(dy) < range + obj.h/2 && Math.abs(dx) < obj.w/2 + 20) isCorrectSide = true;
        if (player.direction === "back" && dy > 0 && Math.abs(dy) < range + obj.h/2 && Math.abs(dx) < obj.w/2 + 20) isCorrectSide = true;

        if (isCorrectSide) typeText(messages[obj.name]);
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    mapData[currentMap].objects.forEach(obj => { if (obj.imgObj && obj.imgObj.complete) ctx.drawImage(obj.imgObj, obj.x, obj.y, obj.w, obj.h); });
    const img = playerImages[player.direction];
    if (img.complete) ctx.drawImage(img, player.x - player.size / 2, player.y - player.size / 2, player.size, player.size);
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; ctx.fillRect(player.x - 25, player.y - 45, 50, 20);
    ctx.fillStyle = "white"; ctx.font = "14px 'DungGeunMo'"; ctx.textAlign = "center"; ctx.fillText(player.name, player.x, player.y - 30);
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
